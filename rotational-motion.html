<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Physics Practice · Rotational Motion &amp; Angular Momentum</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

<style>
:root, [data-theme="dark"] {
  --bg: #12161c;
  --bg-grid: #171c23;
  --card-bg: #1a2029;
  --card-bg-2: #202836;
  --border: #2c3644;
  --text: #e7edf3;
  --text-dim: #8fa1b3;
  --accent: #4fd1c5;
  --accent-2: #f0a355;
  --good: #5fd08a;
  --bad: #ef6a6a;
  --shadow: rgba(0,0,0,0.45);
  --font-body: 'JetBrains Mono', 'Consolas', monospace;
  --font-head: 'Fraunces', Georgia, serif;
}
[data-theme="light"] {
  --bg: #f4f1ea;
  --bg-grid: #eee9de;
  --card-bg: #ffffff;
  --card-bg-2: #f4f6f8;
  --border: #d8d2c4;
  --text: #22282f;
  --text-dim: #5b6672;
  --accent: #0e8f83;
  --accent-2: #c1732a;
  --good: #1f8a4c;
  --bad: #c23a3a;
  --shadow: rgba(80,70,50,0.15);
}

@font-face {
  font-family: 'JetBrains Mono';
  src: local('JetBrains Mono');
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; min-height: 100%;
  background: var(--bg);
  color: var(--text);
}
body {
  font-family: var(--font-body);
  background-image:
    linear-gradient(var(--bg-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
  background-size: 26px 26px;
  padding: env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
  min-height: 100vh;
  transition: background-color .2s, color .2s;
}
a { color: var(--accent); }

.wrap { max-width: 760px; margin: 0 auto; padding: 14px 14px 100px; }

header.app-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; margin-bottom: 12px; flex-wrap: wrap;
}
header.app-head h1 {
  font-family: var(--font-head);
  font-size: 1.28rem;
  margin: 0;
  line-height: 1.25;
}
header.app-head .subtitle {
  font-size: 0.72rem;
  color: var(--text-dim);
  letter-spacing: 0.02em;
}
.head-btns { display: flex; gap: 8px; flex-shrink: 0; }
.icon-btn {
  background: var(--card-bg); border: 1px solid var(--border); color: var(--text);
  width: 40px; height: 40px; border-radius: 10px; font-size: 1.05rem;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 6px var(--shadow);
}
.icon-btn:active { transform: scale(0.94); }

.stat-bar {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  margin-bottom: 12px;
}
.stat {
  background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px;
  padding: 8px 6px; text-align: center;
}
.stat .val { font-size: 1.15rem; font-weight: 700; color: var(--accent); font-family: var(--font-head); }
.stat .lbl { font-size: 0.62rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }

.panel {
  background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px;
  padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 10px var(--shadow);
}
.mode-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.mode-row .grp { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  background: var(--card-bg-2); border: 1px solid var(--border); color: var(--text);
  padding: 7px 12px; border-radius: 999px; font-size: 0.76rem; cursor: pointer;
  font-family: var(--font-body); white-space: nowrap;
}
.chip.active { background: var(--accent); color: #06201d; border-color: var(--accent); font-weight: 700; }
.chip.game.active { background: var(--accent-2); color: #2a1503; border-color: var(--accent-2); }
.mode-label { font-size: 0.68rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; margin-right: 2px; }

#game-progress { font-size: 0.75rem; color: var(--text-dim); margin-top: 8px; display:none; }
#game-progress.show { display: block; }

.set-tag {
  display: inline-block; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--accent-2); border: 1px solid var(--accent-2); border-radius: 6px; padding: 2px 8px;
  margin-bottom: 8px;
}
.prob-title { font-family: var(--font-head); font-size: 1.15rem; margin: 0 0 8px; }
.prob-statement { font-size: 0.92rem; line-height: 1.55; margin-bottom: 14px; }
.prob-statement .katex { font-size: 1.02em; }

.part {
  border-top: 1px dashed var(--border); padding: 12px 0;
}
.part:first-child { border-top: none; padding-top: 0; }
.part-q { font-size: 0.88rem; margin-bottom: 8px; display:flex; gap:8px; }
.part-q .pnum {
  flex-shrink:0; width: 22px; height: 22px; border-radius: 50%;
  background: var(--card-bg-2); border: 1px solid var(--border);
  display:flex; align-items:center; justify-content:center; font-size:0.72rem; font-weight:700;
}
.answer-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-left: 30px;}
.answer-row input[type=number] {
  background: var(--bg); border: 1px solid var(--border); color: var(--text);
  border-radius: 8px; padding: 8px 10px; font-size: 0.95rem; width: 130px;
  font-family: var(--font-body);
}
.answer-row input[type=number]:focus { outline: none; border-color: var(--accent); }
.unit { font-size: 0.8rem; color: var(--text-dim); }
.choice-row { display:flex; gap:6px; flex-wrap: wrap; margin-left: 30px; }
.choice-btn {
  background: var(--card-bg-2); border: 1px solid var(--border); color: var(--text);
  padding: 7px 11px; border-radius: 8px; font-size: 0.78rem; cursor: pointer; font-family: var(--font-body);
}
.choice-btn.picked { border-color: var(--accent); background: rgba(79,209,197,0.15); color: var(--accent); font-weight:700; }

.result-mark { font-size: 1rem; margin-left: 4px; }
.result-mark.correct { color: var(--good); }
.result-mark.incorrect { color: var(--bad); }
.correct-answer { font-size: 0.78rem; color: var(--text-dim); margin-left: 30px; margin-top: 4px; }
.correct-answer.show-it { color: var(--good); }

.btn-row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.btn {
  flex: 1; min-width: 120px; padding: 12px; border-radius: 10px; border: none;
  font-family: var(--font-body); font-size: 0.85rem; font-weight: 700; cursor: pointer;
}
.btn-primary { background: var(--accent); color: #06201d; }
.btn-secondary { background: var(--card-bg-2); color: var(--text); border: 1px solid var(--border); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn:active:not(:disabled) { transform: scale(0.98); }

.solution {
  margin-top: 14px; padding-top: 14px; border-top: 2px solid var(--border);
  font-size: 0.88rem; line-height: 1.6; display: none;
}
.solution.show { display: block; }
.solution h4 { font-family: var(--font-head); font-size: 0.95rem; margin: 10px 0 4px; color: var(--accent); }
.solution .katex-display { margin: 6px 0; overflow-x: auto; overflow-y: hidden; }
.solution p { margin: 4px 0; }

.feedback-banner {
  border-radius: 10px; padding: 10px 12px; font-size: 0.85rem; font-weight: 700;
  margin-bottom: 12px; display: none; text-align: center;
}
.feedback-banner.show { display: block; }
.feedback-banner.all-correct { background: rgba(95,208,138,0.15); color: var(--good); border: 1px solid var(--good); }
.feedback-banner.some-wrong { background: rgba(239,106,106,0.15); color: var(--bad); border: 1px solid var(--bad); }

/* modal (formula sheet + game over) */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.55);
  display: none; align-items: center; justify-content: center; z-index: 200; padding: 16px;
}
.overlay.show { display: flex; }
.modal {
  background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px;
  max-width: 480px; width: 100%; max-height: 82vh; overflow-y: auto;
  padding: 18px; box-shadow: 0 10px 30px var(--shadow); position: relative;
}
.modal h2 { font-family: var(--font-head); margin-top: 0; font-size: 1.15rem; }
.modal .close-x {
  position: absolute; top: 10px; right: 10px; background: none; border: none;
  color: var(--text-dim); font-size: 1.3rem; cursor: pointer; line-height: 1;
}
.formula-block { margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px dashed var(--border); font-size: 0.9rem; }
.formula-block:last-child { border-bottom: none; }
.formula-note { font-size: 0.76rem; color: var(--text-dim); margin-bottom: 14px; line-height: 1.5; }

/* floating calculator (shared component) */
.calc-fab {
  position: fixed; bottom: 20px; right: 20px;
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--accent); color: #06201d; border: none;
  font-size: 1.4rem; cursor: pointer;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
  z-index: 90; display: flex; align-items: center; justify-content: center;
}
.calc-panel {
  position: fixed; bottom: 82px; right: 20px; width: 260px;
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: 12px; padding: 12px;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4); z-index: 90;
}
.calc-display {
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px; text-align: right; font-size: 1.3rem; margin-bottom: 8px;
  word-break: break-all; min-height: 1.6em; font-family: var(--font-body);
}
.calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.calc-btn {
  background: var(--bg); border: 1px solid var(--border); color: var(--text);
  padding: 10px 0; border-radius: 6px; font-size: 0.95rem; cursor: pointer; font-family: var(--font-body);
}
.calc-btn.op { color: var(--accent); font-weight: bold; }
.calc-btn.active { border-color: var(--accent); background: rgba(79,209,197,0.15); color: var(--accent); }
.calc-btn.wide { grid-column: span 2; }
.hidden { display: none !important; }

footer.app-foot { text-align: center; font-size: 0.68rem; color: var(--text-dim); padding: 10px 0 20px; }

@media (max-width: 420px) {
  .stat-bar { grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .stat .val { font-size: 1.0rem; }
  .answer-row, .choice-row { margin-left: 0; }
}
</style>
</head>
<body>
<div class="wrap">

  <header class="app-head">
    <div>
      <h1>Rotational Motion &amp; Angular Momentum</h1>
      <div class="subtitle">Physics Practice · six problem sets, randomized values</div>
    </div>
    <div class="head-btns">
      <button class="icon-btn" id="formula-btn" title="Reference formulas">📖</button>
      <button class="icon-btn" id="theme-btn" title="Toggle dark/light">🌙</button>
    </div>
  </header>

  <div class="stat-bar">
    <div class="stat"><div class="val" id="stat-score">0</div><div class="lbl">Score</div></div>
    <div class="stat"><div class="val" id="stat-streak">0</div><div class="lbl">Streak</div></div>
    <div class="stat"><div class="val" id="stat-high">0</div><div class="lbl">High Score</div></div>
    <div class="stat"><div class="val" id="stat-last">–</div><div class="lbl">Last Score</div></div>
  </div>

  <div class="panel">
    <div class="mode-row">
      <span class="mode-label">Set</span>
      <div class="grp" id="set-chips"></div>
    </div>
    <div class="mode-row" style="margin-top:10px;">
      <span class="mode-label">Game</span>
      <div class="grp" id="game-chips">
        <button class="chip game" data-n="5">5Q</button>
        <button class="chip game" data-n="10">10Q</button>
        <button class="chip game" data-n="15">15Q</button>
      </div>
    </div>
    <div id="game-progress"></div>
  </div>

  <div class="feedback-banner" id="feedback-banner"></div>

  <div class="panel" id="problem-card">
    <div class="set-tag" id="prob-set-tag">SET 1</div>
    <h2 class="prob-title" id="prob-title">Loading…</h2>
    <div class="prob-statement" id="prob-statement"></div>
    <div id="parts-container"></div>

    <div class="btn-row">
      <button class="btn btn-primary" id="submit-btn">Submit Answers</button>
      <button class="btn btn-secondary" id="solution-btn" disabled>Show Solution</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" id="next-btn">Next Problem →</button>
    </div>

    <div class="solution" id="solution-block"></div>
  </div>

  <footer class="app-foot">Use g = 9.80 m/s². Answers graded within ±3% tolerance.</footer>
</div>

<!-- formula sheet modal -->
<div class="overlay" id="formula-overlay">
  <div class="modal">
    <button class="close-x" id="formula-close">×</button>
    <h2>Reference Formulas</h2>
    <div id="formula-body"></div>
  </div>
</div>

<!-- game over modal -->
<div class="overlay" id="gameover-overlay">
  <div class="modal">
    <button class="close-x" id="gameover-close">×</button>
    <h2 id="gameover-title">Game Complete!</h2>
    <p id="gameover-summary" style="font-size:0.95rem;"></p>
    <div class="btn-row">
      <button class="btn btn-primary" id="gameover-again">Play Again</button>
      <button class="btn btn-secondary" id="gameover-practice">Back to Practice</button>
    </div>
  </div>
</div>

<!-- floating calculator -->
<button class="calc-fab" id="calc-fab" onclick="toggleCalculator()" title="Calculator">🧮</button>
<div id="calc-panel" class="calc-panel hidden">
  <div class="calc-display" id="calc-display">0</div>
  <div class="calc-grid">
    <button class="calc-btn op" id="btn-inv" onclick="toggleInv()" title="Inverse trig functions">INV</button>
    <button class="calc-btn op" onclick="calcUnary('sqrt')">√</button>
    <button class="calc-btn op" onclick="calcUnary('square')">x²</button>
    <button class="calc-btn op" onclick="calcUnary('reciprocal')">1/x</button>

    <button class="calc-btn op" id="btn-sin" onclick="calcUnary('sin')">sin</button>
    <button class="calc-btn op" id="btn-cos" onclick="calcUnary('cos')">cos</button>
    <button class="calc-btn op" id="btn-tan" onclick="calcUnary('tan')">tan</button>
    <button class="calc-btn op" onclick="calcInput('e')" title="Scientific notation (e.g. 1.5e3)">EXP</button>

    <button class="calc-btn" onclick="calcClear()">C</button>
    <button class="calc-btn" onclick="calcBackspace()">⌫</button>
    <button class="calc-btn op" onclick="calcInput('%')">%</button>
    <button class="calc-btn op" onclick="calcInput('/')">÷</button>

    <button class="calc-btn wide" onclick="calcInput('(')">(</button>
    <button class="calc-btn wide" onclick="calcInput(')')">)</button>

    <button class="calc-btn" onclick="calcInput('7')">7</button>
    <button class="calc-btn" onclick="calcInput('8')">8</button>
    <button class="calc-btn" onclick="calcInput('9')">9</button>
    <button class="calc-btn op" onclick="calcInput('*')">×</button>

    <button class="calc-btn" onclick="calcInput('4')">4</button>
    <button class="calc-btn" onclick="calcInput('5')">5</button>
    <button class="calc-btn" onclick="calcInput('6')">6</button>
    <button class="calc-btn op" onclick="calcInput('-')">−</button>

    <button class="calc-btn" onclick="calcInput('1')">1</button>
    <button class="calc-btn" onclick="calcInput('2')">2</button>
    <button class="calc-btn" onclick="calcInput('3')">3</button>
    <button class="calc-btn op" onclick="calcInput('+')">+</button>

    <button class="calc-btn wide" onclick="calcInput('0')">0</button>
    <button class="calc-btn" onclick="calcInput('.')">.</button>
    <button class="calc-btn op" onclick="calcEquals()">=</button>
  </div>
</div>

<script>
/* ================= THEME ================= */
function applyThemeIcon(){
  const t = document.documentElement.getAttribute('data-theme');
  document.getElementById('theme-btn').textContent = t==='dark' ? '🌙' : '☀️';
}
function initTheme(){
  const saved = localStorage.getItem('ch10_theme');
  document.documentElement.setAttribute('data-theme', saved || 'dark');
  applyThemeIcon();
}
document.getElementById('theme-btn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('ch10_theme', next);
  applyThemeIcon();
});
initTheme();

/* ================= FLOATING CALCULATOR ================= */
let calcExpr = '';
let calcJustEvaluated = false;
let calcInvMode = false;

function toggleInv() {
  calcInvMode = !calcInvMode;
  document.getElementById('btn-inv').classList.toggle('active', calcInvMode);
  document.getElementById('btn-sin').textContent = calcInvMode ? 'sin⁻¹' : 'sin';
  document.getElementById('btn-cos').textContent = calcInvMode ? 'cos⁻¹' : 'cos';
  document.getElementById('btn-tan').textContent = calcInvMode ? 'tan⁻¹' : 'tan';
}

function toggleCalculator() {
  document.getElementById('calc-panel').classList.toggle('hidden');
}

function calcInput(val) {
  const isDigitOrDot = /^[0-9.e]$/.test(val);
  if (calcJustEvaluated) {
    if (isDigitOrDot) calcExpr = '';
    calcJustEvaluated = false;
  }
  calcExpr += val;
  document.getElementById('calc-display').textContent = calcExpr;
}

function calcClear() {
  calcExpr = '';
  calcJustEvaluated = false;
  document.getElementById('calc-display').textContent = '0';
}

function calcBackspace() {
  calcJustEvaluated = false;
  calcExpr = calcExpr.slice(0, -1);
  document.getElementById('calc-display').textContent = calcExpr || '0';
}

function calcEvalRaw(expr) {
  if (!/^[0-9+\-*/.%()eE\s]+$/.test(expr)) throw new Error('invalid');
  const result = Function('"use strict"; return (' + expr + ')')();
  if (!Number.isFinite(result)) throw new Error('invalid');
  return result;
}

function calcFormat(n) {
  if (!Number.isFinite(n)) return 'Error';
  const abs = Math.abs(n);
  if (abs !== 0 && (abs >= 1e9 || abs < 1e-6)) {
    return n.toExponential(6).replace(/\.?0+e/, 'e');
  }
  return String(Math.round(n * 1e8) / 1e8);
}

function calcEquals() {
  if (!calcExpr) return;
  try {
    calcExpr = calcFormat(calcEvalRaw(calcExpr));
  } catch (e) {
    calcExpr = '';
    document.getElementById('calc-display').textContent = 'Error';
    calcJustEvaluated = false;
    return;
  }
  document.getElementById('calc-display').textContent = calcExpr;
  calcJustEvaluated = true;
}

function calcUnary(fn) {
  if (!calcExpr) return;
  let value;
  try {
    value = calcEvalRaw(calcExpr);
  } catch (e) {
    document.getElementById('calc-display').textContent = 'Error';
    calcExpr = '';
    calcJustEvaluated = false;
    return;
  }

  function fail() {
    document.getElementById('calc-display').textContent = 'Error';
    calcExpr = '';
    calcJustEvaluated = false;
  }

  let result;
  switch (fn) {
    case 'sqrt':
      if (value < 0) return fail();
      result = Math.sqrt(value);
      break;
    case 'square':
      result = value * value;
      break;
    case 'reciprocal':
      if (value === 0) return fail();
      result = 1 / value;
      break;
    case 'sin':
      result = calcInvMode ? Math.asin(value) * 180 / Math.PI : Math.sin(value * Math.PI / 180);
      if (calcInvMode && (value < -1 || value > 1)) return fail();
      break;
    case 'cos':
      result = calcInvMode ? Math.acos(value) * 180 / Math.PI : Math.cos(value * Math.PI / 180);
      if (calcInvMode && (value < -1 || value > 1)) return fail();
      break;
    case 'tan':
      result = calcInvMode ? Math.atan(value) * 180 / Math.PI : Math.tan(value * Math.PI / 180);
      break;
  }

  if (!Number.isFinite(result)) return fail();

  calcExpr = calcFormat(result);
  document.getElementById('calc-display').textContent = calcExpr;
  calcJustEvaluated = true;
}
</script>
<script>
/* ================= NUMERIC HELPERS ================= */
const G = 9.80;
const TWO_PI = 2*Math.PI;
const rpm2w = rpm => rpm*TWO_PI/60;

function R(min, max, dec=2){
  const v = min + Math.random()*(max-min);
  return +v.toFixed(dec);
}
function Rstep(min, max, step, dec=0){
  const n = Math.round((max-min)/step);
  const v = min + Math.floor(Math.random()*(n+1))*step;
  return +v.toFixed(dec);
}

/* format a number for display: 3 sig figs, scientific notation outside typical range */
function fmt(x){
  if (!isFinite(x)) return '\\text{—}';
  if (x === 0) return '0';
  const sign = x < 0 ? '-' : '';
  const abs = Math.abs(x);
  if (abs >= 100000 || abs < 0.001){
    const exp = Math.floor(Math.log10(abs));
    let mant = abs / Math.pow(10, exp);
    // guard rounding pushing mantissa to 10
    if (+mant.toFixed(2) >= 10){ mant/=10; }
    return sign + mant.toFixed(2) + '\\times10^{' + Math.floor(Math.log10(abs)) + '}';
  }
  let p = +abs.toPrecision(3);
  return sign + p.toString();
}
/* plain (non-latex) formatted string, for on-screen correct-answer display */
function fmtPlain(x){
  if (!isFinite(x)) return '—';
  if (x === 0) return '0';
  const sign = x < 0 ? '-' : '';
  const abs = Math.abs(x);
  if (abs >= 100000 || abs < 0.001){
    const exp = Math.floor(Math.log10(abs));
    let mant = abs / Math.pow(10, exp);
    if (+mant.toFixed(2) >= 10){ mant/=10; }
    return sign + mant.toFixed(2) + 'e' + exp;
  }
  let p = +abs.toPrecision(3);
  return sign + p.toString();
}

function approxEqual(actual, expected, tol=0.03){
  if (Math.abs(expected) < 1e-9) return Math.abs(actual) < 1e-6;
  return Math.abs((actual-expected)/expected) <= tol;
}

    <p>The increase comes from chemical energy used by the child while walking inward.</p>`
});

PROBLEMS.push({
  set:5, id:'s5-4', title:'Astronaut and reaction wheel',
  gen(){
    const Ic = R(14,22,1);
    const Iw = R(0.5,1.1,2);
    const rpmRel = Rstep(1800,3000,100);
    const wRel = rpm2w(rpmRel);
    const wc = -(Iw*wRel)/(Ic+Iw);
    const ww = wc+wRel;
    const K = 0.5*Ic*wc*wc + 0.5*Iw*ww*ww;
    return {Ic,Iw,rpmRel,wRel,wc,ww,K};
  },
  statement:v => `An astronaut-plus-chair system has moment of inertia ${fmt(v.Ic)} kg·m² and is initially at rest in space. A reaction wheel inside the chair, with moment of inertia ${fmt(v.Iw)} kg·m², is accelerated to ${v.rpmRel} rpm relative to the chair.`,
  parts:[
    {prompt:"Wheel's angular speed relative to the chair.", unit:'rad/s', answer:v=>v.wRel},
    {prompt:'Chair\'s angular speed in the inertial (lab) frame.', unit:'rad/s', answer:v=>v.wc, tol:0.04},
    {prompt:"Wheel's angular speed in the inertial frame.", unit:'rad/s', answer:v=>v.ww},
    {prompt:'Total rotational kinetic energy after the wheel reaches full speed.', unit:'J', answer:v=>v.K, tol:0.05},
  ],
  solution:v => `
    <p><b>1.</b> \\(\\omega_\\mathrm{rel}=${v.rpmRel}\\left(\\dfrac{2\\pi}{60}\\right)=${fmt(v.wRel)}\\text{ rad/s}\\)</p>
    <p>Total angular momentum is conserved (starts at zero): \\(I_c\\omega_c+I_w(\\omega_c+\\omega_\\mathrm{rel})=0\\)</p>
    <p><b>2.</b> \\(\\omega_c=-\\dfrac{I_w\\,\\omega_\\mathrm{rel}}{I_c+I_w}=${fmt(v.wc)}\\text{ rad/s}\\)</p>
    <p>The chair rotates opposite the wheel's spin direction.</p>
    <p><b>3.</b> \\(\\omega_w=\\omega_c+\\omega_\\mathrm{rel}=${fmt(v.ww)}\\text{ rad/s}\\)</p>
    <p><b>4.</b> \\(K=\\tfrac12I_c\\omega_c^2+\\tfrac12I_w\\omega_w^2=${fmt(v.K)}\\text{ J}\\)</p>`
});

PROBLEMS.push({
  set:5, id:'s5-5', title:'Torque slowing a rotating wheel',
  gen(){
    const I = R(4.5,7.0,2);
    const wi = R(14,22,1);
    const tau = R(9,16,1);
    const alpha = -tau/I;
    const t = wi/(tau/I);
    const theta = 0.5*wi*t;
    const dL = I*(0-wi);
    return {I,wi,tau,alpha,t,theta,dL};
  },
  statement:v => `A wheel with moment of inertia ${fmt(v.I)} kg·m² rotates at ${fmt(v.wi)} rad/s. A constant opposing torque of ${fmt(v.tau)} N·m is applied.`,
  parts:[
    {prompt:'Angular deceleration \\(\\alpha\\) (include the sign).', unit:'rad/s²', answer:v=>v.alpha},
    {prompt:'Time to stop.', unit:'s', answer:v=>v.t},
    {prompt:'Angular displacement before stopping.', unit:'rad', answer:v=>v.theta},
    {prompt:'Change in angular momentum \\(\\Delta L\\) (include the sign).', unit:'kg·m²/s', answer:v=>v.dL},
  ],
  solution:v => `
    <p><b>1.</b> \\(\\alpha=\\dfrac{-\\tau}{I}=\\dfrac{-${fmt(v.tau)}}{${fmt(v.I)}}=${fmt(v.alpha)}\\text{ rad/s}^2\\)</p>
    <p><b>2.</b> \\(0=\\omega_i+\\alpha t\\Rightarrow t=${fmt(v.t)}\\text{ s}\\)</p>
    <p><b>3.</b> \\(\\theta=\\tfrac12(\\omega_i+0)t=${fmt(v.theta)}\\text{ rad}\\)</p>
    <p><b>4.</b> \\(\\Delta L=I(\\omega_f-\\omega_i)=${fmt(v.dL)}\\text{ kg·m}^2/\\text{s}\\)</p>
    <p>Check: angular impulse \\(\\tau\\Delta t=(-${fmt(v.tau)})(${fmt(v.t)})=${fmt(-v.tau*v.t)}\\text{ N·m·s}\\), matching \\(\\Delta L\\) above.</p>`
});
/* ---------------- SET 6: Rotational Collisions and Vector/Gyroscopic Concepts ---------------- */
PROBLEMS.push({
  set:6, id:'s6-1', title:'Particle sticks to a pivoted rod',
  gen(){
    const m = R(0.05,0.10,4);
    const v0 = R(18,30,1);
    const L = R(0.9,1.3,2);
    const Mrod = R(1.4,2.2,2);
    const Li = m*v0*L;
    const Irod = (1/3)*Mrod*L*L;
    const Ipuck = m*L*L;
    const If = Irod+Ipuck;
    const wf = Li/If;
    const Ki = 0.5*m*v0*v0;
    const Kf = 0.5*If*wf*wf;
    return {m,v0,L,Mrod,Li,Irod,Ipuck,If,wf,Ki,Kf};
  },
  statement:v => `A ${fmt(v.m)} kg puck moves at ${fmt(v.v0)} m/s perpendicular to a ${fmt(v.L)} m uniform rod that is pivoted at one end. The rod has mass ${fmt(v.Mrod)} kg and is initially at rest. The puck sticks to the far end.`,
  parts:[
    {prompt:"System's initial angular momentum about the pivot.", unit:'kg·m²/s', answer:v=>v.Li},
    {prompt:'Total moment of inertia after the collision.', unit:'kg·m²', answer:v=>v.If},
    {prompt:'Angular speed just after impact.', unit:'rad/s', answer:v=>v.wf},
    {prompt:'Kinetic energy just after the collision (compare with the initial KE in the solution).', unit:'J', answer:v=>v.Kf, tol:0.05},
  ],
  solution:v => `
    <p><b>1.</b> \\(L_i=mvL=(${fmt(v.m)})(${fmt(v.v0)})(${fmt(v.L)})=${fmt(v.Li)}\\text{ kg·m}^2/\\text{s}\\)</p>
    <p><b>2.</b> Rod about one end: \\(I_\\mathrm{rod}=\\tfrac13M_\\mathrm{rod}L^2=${fmt(v.Irod)}\\text{ kg·m}^2\\); puck: \\(I_\\mathrm{puck}=mL^2=${fmt(v.Ipuck)}\\text{ kg·m}^2\\)</p>
    <p>\\(I_f=${fmt(v.Irod)}+${fmt(v.Ipuck)}=${fmt(v.If)}\\text{ kg·m}^2\\)</p>
    <p><b>3.</b> \\(L_i=I_f\\omega_f\\Rightarrow\\omega_f=\\dfrac{${fmt(v.Li)}}{${fmt(v.If)}}=${fmt(v.wf)}\\text{ rad/s}\\)</p>
    <p><b>4.</b> \\(K_i=\\tfrac12mv^2=${fmt(v.Ki)}\\text{ J}\\); \\(K_f=\\tfrac12I_f\\omega_f^2=${fmt(v.Kf)}\\text{ J}\\)</p>
    <p>The collision is inelastic, so kinetic energy is not conserved.</p>`
});

PROBLEMS.push({
  set:6, id:'s6-2', title:'Bullet embedded in a disk',
  gen(){
    const m = R(0.010,0.020,4);
    const v0 = Rstep(280,360,5);
    const M = R(3.0,5.0,2);
    const Rr = R(0.20,0.30,3);
    const Li = m*v0*Rr;
    const Idisk = 0.5*M*Rr*Rr;
    const Ibullet = m*Rr*Rr;
    const If = Idisk+Ibullet;
    const wf = Li/If;
    const Ki = 0.5*m*v0*v0;
    const Kf = 0.5*If*wf*wf;
    const frac = Kf/Ki;
    return {m,v0,M,R:Rr,Li,Idisk,Ibullet,If,wf,Ki,Kf,frac};
  },
  statement:v => `A ${fmt(v.m)} kg bullet moving at ${fmt(v.v0)} m/s strikes tangentially and embeds at the rim of a uniform disk of mass ${fmt(v.M)} kg and radius ${fmt(v.R)} m. The disk is initially at rest on a frictionless axle.`,
  parts:[
    {prompt:'Initial angular momentum about the axle.', unit:'kg·m²/s', answer:v=>v.Li},
    {prompt:'Disk-plus-bullet moment of inertia after impact.', unit:'kg·m²', answer:v=>v.If},
    {prompt:'Final angular speed.', unit:'rad/s', answer:v=>v.wf},
    {prompt:'Fraction of initial kinetic energy remaining as rotational KE (as a decimal, e.g. 0.05 for 5%).', unit:'(fraction)', answer:v=>v.frac, tol:0.06},
  ],
  solution:v => `
    <p><b>1.</b> \\(L_i=mvR=(${fmt(v.m)})(${fmt(v.v0)})(${fmt(v.R)})=${fmt(v.Li)}\\text{ kg·m}^2/\\text{s}\\)</p>
    <p><b>2.</b> \\(I_\\mathrm{disk}=\\tfrac12MR^2=${fmt(v.Idisk)}\\text{ kg·m}^2\\); bullet: \\(I_\\mathrm{bullet}=mR^2=${fmt(v.Ibullet)}\\text{ kg·m}^2\\)</p>
    <p>\\(I_f=${fmt(v.Idisk)}+${fmt(v.Ibullet)}=${fmt(v.If)}\\text{ kg·m}^2\\)</p>
    <p><b>3.</b> \\(\\omega_f=\\dfrac{L_i}{I_f}=${fmt(v.wf)}\\text{ rad/s}\\)</p>
    <p><b>4.</b> \\(K_i=\\tfrac12mv^2=${fmt(v.Ki)}\\text{ J}\\); \\(K_f=\\tfrac12I_f\\omega_f^2=${fmt(v.Kf)}\\text{ J}\\)</p>
    \\[\\frac{K_f}{K_i}=${fmt(v.frac)}\\]`
});

PROBLEMS.push({
  set:6, id:'s6-3', title:'Sweet-spot conceptual calculation',
  gen(){
    const M = R(0.25,0.40,3);
    const L = R(0.60,0.80,3);
    const I = (1/3)*M*L*L;
    const d = L/2;
    const xp = I/(M*d);
    return {M,L,I,d,xp};
  },
  statement:v => `A uniform tennis racquet is modeled as a ${fmt(v.M)} kg rod of length ${fmt(v.L)} m pivoted at the handle end. Neglect the handle's mass. The point of percussion for a rigid body pivoted at one end is \\(x_p=\\dfrac{I}{Md}\\), where \\(d\\) is the center-of-mass distance from the pivot.`,
  parts:[
    {prompt:'Moment of inertia \\(I\\) of the racquet model about the pivot.', unit:'kg·m²', answer:v=>v.I},
    {prompt:'Center-of-mass distance \\(d\\) from the pivot.', unit:'m', answer:v=>v.d},
    {prompt:'Point of percussion \\(x_p\\), measured from the handle.', unit:'m', answer:v=>v.xp},
  ],
  solution:v => `
    <p><b>1.</b> \\(I=\\tfrac13ML^2=\\tfrac13(${fmt(v.M)})(${fmt(v.L)})^2=${fmt(v.I)}\\text{ kg·m}^2\\)</p>
    <p><b>2.</b> \\(d=\\dfrac{L}{2}=${fmt(v.d)}\\text{ m}\\)</p>
    <p><b>3.</b> \\(x_p=\\dfrac{I}{Md}=\\dfrac{${fmt(v.I)}}{(${fmt(v.M)})(${fmt(v.d)})}=${fmt(v.xp)}\\text{ m from the handle}\\)</p>
    <p>The tip is at ${fmt(v.L)} m and the midpoint at ${fmt(v.d)} m. The sweet spot sits closer to the middle than to the tip, though shifted slightly toward the tip from the center of mass.</p>`
});

PROBLEMS.push({
  set:6, id:'s6-4', title:'Direction of angular momentum and torque', type:'choice',
  gen(){ return {}; },
  statement:v => `A horizontal disk rotates counterclockwise when viewed from above. A tangential force is then applied at the point on the disk closest to you, directed toward your right.`,
  parts:[
    {prompt:"Direction of the disk's initial angular momentum \\(\\vec L\\).", type:'choice',
      options:['Upward','Downward','Toward you','Away from you'], answer:v=>0},
    {prompt:'Sign of the torque produced about the vertical axis.', type:'choice',
      options:['Positive','Negative','Zero'], answer:v=>0},
    {prompt:'Does the magnitude of \\(\\vec L\\) initially increase or decrease?', type:'choice',
      options:['Increases','Decreases','Stays constant'], answer:v=>0},
    {prompt:'If the applied force instead acted radially inward, what torque would it produce?', type:'choice',
      options:['Zero', 'Maximum positive', 'Maximum negative'], answer:v=>0},
  ],
  solution:v => `
    <p><b>1.</b> Curl the right hand's fingers counterclockwise as viewed from above — the thumb points upward. \\(\\vec L\\) points upward.</p>
    <p><b>2.</b> At the point closest to you, the radius vector points toward you; a force to your right creates a counterclockwise tendency viewed from above, so the torque points upward: \\(\\tau_z>0\\).</p>
    <p><b>3.</b> Torque and angular momentum point the same way, so \\(|\\vec L|\\) increases.</p>
    <p><b>4.</b> A radially inward force acts along the line through the axis (\\(\\phi=180^\\circ\\)), so \\(\\tau=rF\\sin180^\\circ=0\\).</p>`
});

PROBLEMS.push({
  set:6, id:'s6-5', title:'Earth-like precession estimate',
  gen(){
    const L = R(6,10,2);
    const tau = R(0.4,0.8,2);
    const dLdt = tau;
    const Omega = tau/L;
    const T = TWO_PI/Omega;
    return {L,tau,dLdt,Omega,T};
  },
  statement:v => `A spinning gyroscope has angular momentum magnitude \\(L=${fmt(v.L)}\\text{ kg·m}^2/\\text{s}\\). A constant torque of magnitude ${fmt(v.tau)} N·m acts perpendicular to \\(\\vec L\\).`,
  parts:[
    {prompt:'Magnitude of \\(d\\vec L/dt\\).', unit:'kg·m²/s²', answer:v=>v.dLdt},
    {prompt:'Instantaneous precession rate \\(\\Omega=\\tau/L\\).', unit:'rad/s', answer:v=>v.Omega},
    {prompt:'Corresponding precession period.', unit:'s', answer:v=>v.T},
  ],
  solution:v => `
    <p><b>1.</b> By the rotational form of Newton's second law: \\(\\left|\\dfrac{d\\vec L}{dt}\\right|=\\tau=${fmt(v.tau)}\\text{ kg·m}^2/\\text{s}^2\\)</p>
    <p><b>2.</b> \\(\\Omega=\\dfrac{\\tau}{L}=\\dfrac{${fmt(v.tau)}}{${fmt(v.L)}}=${fmt(v.Omega)}\\text{ rad/s}\\)</p>
    <p><b>3.</b> \\(T=\\dfrac{2\\pi}{\\Omega}=${fmt(v.T)}\\text{ s}\\)</p>
    <p>The torque is perpendicular to \\(\\vec L\\), so it rotates the vector without changing its length at that instant — angular momentum changes direction rather than magnitude. This directional change is the basis of gyroscopic precession.</p>`
});

</script>
<script>
/* ================= APP STATE ================= */
const SETS = [1,2,3,4,5,6];
const SET_NAMES = {
  1:'Angular Accel. & Circular Motion', 2:'Rotational Kinematics',
  3:'Torque, Inertia & Dynamics', 4:'Work, Energy & Rolling',
  5:'Angular Momentum & Conservation', 6:'Collisions & Gyroscopic Concepts'
};

let state = {
  poolFilter: 'all',      // 'all' or set number
  mode: 'practice',        // 'practice' | 'game'
  bag: [],                 // shuffled remaining problems for current pool (practice)
  gameQueue: [], gameIndex: 0, gameN: 0, gameCorrect: 0,
  current: null, currentVars: null, submitted: false,
  score: 0, attempted: 0, streak: 0, highScore: 0, lastScore: null
};

function loadStats(){
  try{
    const s = JSON.parse(localStorage.getItem('ch10_stats')||'{}');
    state.score = s.score||0;
    state.attempted = s.attempted||0;
    state.streak = s.streak||0;
    state.highScore = s.highScore||0;
    state.lastScore = (s.lastScore!==undefined)?s.lastScore:null;
  }catch(e){}
}
function saveStats(){
  localStorage.setItem('ch10_stats', JSON.stringify({
    score: state.score, attempted: state.attempted, streak: state.streak,
    highScore: state.highScore, lastScore: state.lastScore
  }));
}

function shuffle(arr){
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function currentPool(){
  if (state.poolFilter==='all') return PROBLEMS;
  return PROBLEMS.filter(p=>p.set===state.poolFilter);
}

function drawFromBag(){
  if (state.bag.length===0) state.bag = shuffle(currentPool());
  return state.bag.pop();
}

/* ================= RENDERING ================= */
function renderMath(container){
  if (window.renderMathInElement){
    renderMathInElement(container, {
      delimiters: [
        {left:'\\[', right:'\\]', display:true},
        {left:'\\(', right:'\\)', display:false},
      ],
      throwOnError:false
    });
  }
}

function loadProblem(p){
  state.current = p;
  state.currentVars = p.gen();
  state.submitted = false;
  renderProblem();
}

function renderProblem(){
  const p = state.current, v = state.currentVars;
  document.getElementById('prob-set-tag').textContent = 'SET ' + p.set + ' · ' + SET_NAMES[p.set];
  document.getElementById('prob-title').textContent = p.title;
  document.getElementById('prob-statement').innerHTML = p.statement(v);

  const pc = document.getElementById('parts-container');
  pc.innerHTML = '';
  p.parts.forEach((part, i) => {
    const div = document.createElement('div');
    div.className = 'part';
    const promptText = typeof part.prompt==='function' ? part.prompt(v) : part.prompt;
    let inner = `<div class="part-q"><span class="pnum">${i+1}</span><span>${promptText}</span></div>`;
    if (part.type==='choice'){
      inner += `<div class="choice-row" data-idx="${i}">` +
        part.options.map((opt,oi)=>`<button type="button" class="choice-btn" data-oi="${oi}">${opt}</button>`).join('') +
        `</div>`;
    } else {
      inner += `<div class="answer-row">
        <input type="number" step="any" inputmode="decimal" data-idx="${i}" placeholder="answer">
        <span class="unit">${part.unit||''}</span>
        <span class="result-mark" id="mark-${i}"></span>
      </div>
      <div class="correct-answer" id="correct-${i}"></div>`;
    }
    div.innerHTML = inner;
    pc.appendChild(div);
  });

  // wire choice buttons
  pc.querySelectorAll('.choice-row').forEach(row=>{
    row.addEventListener('click', e=>{
      if (state.submitted) return;
      const btn = e.target.closest('.choice-btn');
      if (!btn) return;
      row.querySelectorAll('.choice-btn').forEach(b=>b.classList.remove('picked'));
      btn.classList.add('picked');
    });
  });

  document.getElementById('submit-btn').disabled = false;
  document.getElementById('solution-btn').disabled = true;
  const solBlock = document.getElementById('solution-block');
  solBlock.classList.remove('show');
  solBlock.innerHTML = '';
  const fb = document.getElementById('feedback-banner');
  fb.classList.remove('show','all-correct','some-wrong');

  renderMath(document.getElementById('problem-card'));
  updateStatBar();
  updateGameProgress();
}

/* ================= GRADING ================= */
function gradeProblem(){
  const p = state.current, v = state.currentVars;
  let allCorrect = true;
  p.parts.forEach((part, i) => {
    let correct;
    if (part.type==='choice'){
      const row = document.querySelector(`.choice-row[data-idx="${i}"]`);
      const picked = row.querySelector('.choice-btn.picked');
      const oi = picked ? +picked.dataset.oi : -1;
      correct = (oi === part.answer(v));
      row.querySelectorAll('.choice-btn').forEach(b=>b.style.pointerEvents='none');
      if (picked) picked.style.borderColor = correct ? 'var(--good)' : 'var(--bad)';
      if (!correct){
        const rightBtn = row.querySelector(`.choice-btn[data-oi="${part.answer(v)}"]`);
        if (rightBtn) rightBtn.style.borderColor = 'var(--good)';
      }
    } else {
      const input = document.querySelector(`input[data-idx="${i}"]`);
      const userVal = parseFloat(input.value);
      const trueVal = part.answer(v);
      correct = isFinite(userVal) && approxEqual(userVal, trueVal, part.tol||0.03);
      const mark = document.getElementById('mark-'+i);
      mark.textContent = correct ? '✓' : '✗';
      mark.className = 'result-mark ' + (correct?'correct':'incorrect');
      const ca = document.getElementById('correct-'+i);
      ca.textContent = 'Correct answer: ' + fmtPlain(trueVal) + (part.unit ? ' '+part.unit : '');
      ca.classList.add('show-it');
      input.style.borderColor = correct ? 'var(--good)' : 'var(--bad)';
    }
    if (!correct) allCorrect = false;
  });
  return allCorrect;
}

function updateStatBar(){
  document.getElementById('stat-score').textContent =
    state.mode==='game' ? `${state.gameCorrect}/${state.gameIndex}` : `${state.score}/${state.attempted}`;
  document.getElementById('stat-streak').textContent = state.streak;
  document.getElementById('stat-high').textContent = state.highScore ? state.highScore+'%' : '0%';
  document.getElementById('stat-last').textContent = (state.lastScore===null) ? '–' : state.lastScore+'%';
}
function updateGameProgress(){
  const el = document.getElementById('game-progress');
  if (state.mode==='game'){
    el.classList.add('show');
    el.textContent = `Game mode: question ${state.gameIndex+1} of ${state.gameN} · correct so far: ${state.gameCorrect}`;
  } else {
    el.classList.remove('show');
  }
}

/* ================= EVENTS ================= */
document.getElementById('submit-btn').addEventListener('click', () => {
  if (state.submitted) return;
  state.submitted = true;
  const allCorrect = gradeProblem();

  state.attempted++;
  if (allCorrect){ state.score++; state.streak++; } else { state.streak = 0; }
  if (state.streak > 0 && state.streak % 1 === 0){ /* streak already updated */ }

  const fb = document.getElementById('feedback-banner');
  fb.classList.add('show');
  fb.className = 'feedback-banner show ' + (allCorrect?'all-correct':'some-wrong');
  fb.textContent = allCorrect ? '✓ All parts correct!' : 'Some parts need review — check the marks below.';

  document.getElementById('submit-btn').disabled = true;
  document.getElementById('solution-btn').disabled = false;

  if (state.mode==='game'){
    if (allCorrect) state.gameCorrect++;
    state.gameIndex++;
  }

  saveStats();
  updateStatBar();
  updateGameProgress();
});

document.getElementById('solution-btn').addEventListener('click', () => {
  const p = state.current, v = state.currentVars;
  const solBlock = document.getElementById('solution-block');
  solBlock.innerHTML = '<h4>Worked Solution</h4>' + p.solution(v);
  solBlock.classList.add('show');
  renderMath(solBlock);
});

document.getElementById('next-btn').addEventListener('click', () => {
  advance();
});

function advance(){
  if (state.mode==='game'){
    if (state.gameIndex >= state.gameN){
      endGame();
      return;
    }
    loadProblem(state.gameQueue[state.gameIndex]);
  } else {
    loadProblem(drawFromBag());
  }
}

function endGame(){
  const pct = Math.round(100*state.gameCorrect/state.gameN);
  state.lastScore = pct;
  if (pct > state.highScore) state.highScore = pct;
  saveStats();
  document.getElementById('gameover-title').textContent = 'Game Complete!';
  document.getElementById('gameover-summary').textContent =
    `You scored ${state.gameCorrect} out of ${state.gameN} (${pct}%).` +
    (pct>=state.highScore && pct>0 ? ' New high score!' : '');
  document.getElementById('gameover-overlay').classList.add('show');
  state.mode = 'practice';
  state.bag = shuffle(currentPool());
  updateModeChips();
  updateStatBar();
  updateGameProgress();
}

/* ================= MODE CHIPS ================= */
function buildSetChips(){
  const wrap = document.getElementById('set-chips');
  wrap.innerHTML = '';
  const allBtn = document.createElement('button');
  allBtn.className = 'chip active';
  allBtn.textContent = 'All (mixed)';
  allBtn.dataset.set = 'all';
  wrap.appendChild(allBtn);
  SETS.forEach(n=>{
    const b = document.createElement('button');
    b.className = 'chip';
    b.textContent = 'Set '+n;
    b.dataset.set = n;
    wrap.appendChild(b);
  });
  wrap.addEventListener('click', e=>{
    const btn = e.target.closest('.chip');
    if (!btn) return;
    state.poolFilter = btn.dataset.set==='all' ? 'all' : +btn.dataset.set;
    state.mode = 'practice';
    state.bag = shuffle(currentPool());
    updateModeChips();
    advance();
  });
}

function updateModeChips(){
  document.querySelectorAll('#set-chips .chip').forEach(b=>{
    const isAll = b.dataset.set==='all';
    b.classList.toggle('active', state.mode==='practice' && ((isAll && state.poolFilter==='all') || (!isAll && +b.dataset.set===state.poolFilter)));
  });
  document.querySelectorAll('#game-chips .chip').forEach(b=>{
    b.classList.toggle('active', state.mode==='game' && +b.dataset.n===state.gameN);
  });
}

document.getElementById('game-chips').addEventListener('click', e=>{
  const btn = e.target.closest('.chip');
  if (!btn) return;
  const n = +btn.dataset.n;
  startGame(n);
});

function startGame(n){
  state.mode = 'game';
  state.gameN = n;
  state.gameIndex = 0;
  state.gameCorrect = 0;
  const bag = shuffle(PROBLEMS);
  state.gameQueue = bag.slice(0, n);
  updateModeChips();
  loadProblem(state.gameQueue[0]);
}

document.getElementById('gameover-again').addEventListener('click', () => {
  document.getElementById('gameover-overlay').classList.remove('show');
  startGame(state.gameN);
});
document.getElementById('gameover-practice').addEventListener('click', () => {
  document.getElementById('gameover-overlay').classList.remove('show');
  advance();
});
document.getElementById('gameover-close').addEventListener('click', () => {
  document.getElementById('gameover-overlay').classList.remove('show');
  advance();
});

/* ================= FORMULA SHEET ================= */
const FORMULAS = [
  '\\omega=\\omega_0+\\alpha t',
  '\\theta=\\theta_0+\\omega_0t+\\tfrac12\\alpha t^2',
  '\\omega^2=\\omega_0^2+2\\alpha\\Delta\\theta',
  'v=r\\omega,\\qquad a_t=r\\alpha,\\qquad a_c=r\\omega^2',
  '\\tau=rF\\sin\\phi,\\qquad \\tau_\\mathrm{net}=I\\alpha',
  'K_\\mathrm{rot}=\\tfrac12I\\omega^2,\\qquad W=\\tau\\Delta\\theta',
  'L=I\\omega,\\qquad \\Delta L=\\tau\\Delta t'
];
function buildFormulaSheet(){
  const body = document.getElementById('formula-body');
  body.innerHTML = '<div class="formula-note">Use g = 9.80 m/s². Convert revolutions, rpm, and degrees to radians before substituting into rotational equations. Take counterclockwise as positive unless stated otherwise. For rolling without slipping, v = Rω.</div>' +
    FORMULAS.map(f=>`<div class="formula-block">\\[${f}\\]</div>`).join('');
  renderMath(body);
}
document.getElementById('formula-btn').addEventListener('click', () => {
  document.getElementById('formula-overlay').classList.add('show');
});
document.getElementById('formula-close').addEventListener('click', () => {
  document.getElementById('formula-overlay').classList.remove('show');
});
document.getElementById('formula-overlay').addEventListener('click', (e) => {
  if (e.target.id==='formula-overlay') e.target.classList.remove('show');
});

/* ================= INIT ================= */
loadStats();
buildSetChips();
buildFormulaSheet();
state.bag = shuffle(currentPool());
updateModeChips();
advance();

</script>
</body>
