<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Circular Motion &amp; Gravitation</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1420; --bg2:#141b29; --grid:#1b2333; --card:#161d2c; --card2:#1b2436;
  --ink:#e8ecf4; --ink-dim:#9aa6bb; --ink-faint:#5f6b81;
  --amber:#f0a93a; --amber-dim:#c98a2c; --teal:#3fd9c7; --teal-dim:#2aa89a;
  --good:#5fd97a; --bad:#f0665a; --line:#28324a; --line-soft:#1f293c;
  --shadow: 0 8px 30px rgba(0,0,0,0.45);
  --serif:'Fraunces', Georgia, serif; --mono:'JetBrains Mono', ui-monospace, monospace;
  color-scheme: dark;
}
[data-theme="light"]{
  --bg:#f4f1e8; --bg2:#ece7d8; --grid:#e2dcc9; --card:#fffdf7; --card2:#f7f2e4;
  --ink:#20241f; --ink-dim:#585448; --ink-faint:#8a8574;
  --amber:#b2650a; --amber-dim:#8a4f08; --teal:#0f8c7c; --teal-dim:#0b6a5e;
  --good:#2a8f45; --bad:#c23a2e; --line:#d8d0b8; --line-soft:#e6e0cc;
  --shadow: 0 8px 24px rgba(60,50,20,0.12);
  color-scheme: light;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    linear-gradient(var(--grid) 1px, transparent 1px) 0 0/28px 28px,
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/28px 28px,
    var(--bg);
  color:var(--ink);
  font-family:var(--mono);
  min-height:100vh;
  padding-bottom:60px;
  transition:background-color .2s, color .2s;
}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 40px;}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:6px 2px 16px;}
h1{
  font-family:var(--serif); font-weight:700; font-size:1.5rem; line-height:1.15;
  margin:0 0 4px; letter-spacing:.2px;
}
h1 span{color:var(--amber);}
.subtitle{color:var(--ink-dim); font-size:.78rem; letter-spacing:.03em;}
.iconbtns{display:flex; gap:8px; flex-shrink:0;}
.iconbtn{
  background:var(--card2); border:1px solid var(--line); color:var(--ink);
  border-radius:10px; padding:8px 10px; font-family:var(--mono); font-size:.78rem;
  cursor:pointer; display:flex; align-items:center; gap:6px; transition:.15s;
  white-space:nowrap;
}
.iconbtn:hover{border-color:var(--teal); color:var(--teal);}
.iconbtn:active{transform:translateY(1px);}

.stats{
  display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-bottom:14px;
}
.stat{
  background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:10px 12px; text-align:center;
}
.stat .num{font-family:var(--serif); font-weight:700; font-size:1.25rem; color:var(--amber);}
.stat .lbl{font-size:.62rem; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.08em; margin-top:2px;}
.stat.teal .num{color:var(--teal);}

.controls{
  display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px;
}
.controls label{
  display:block; font-size:.62rem; color:var(--ink-faint); text-transform:uppercase;
  letter-spacing:.08em; margin-bottom:4px;
}
select{
  width:100%; background:var(--card2); color:var(--ink); border:1px solid var(--line);
  border-radius:10px; padding:9px 10px; font-family:var(--mono); font-size:.82rem;
  appearance:none; -webkit-appearance:none;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-dim) 50%), linear-gradient(135deg, var(--ink-dim) 50%, transparent 50%);
  background-position: calc(100% - 16px) 55%, calc(100% - 11px) 55%;
  background-size: 5px 5px, 5px 5px; background-repeat:no-repeat;
}
select:disabled{opacity:.5;}

.progress-bar{
  height:6px; background:var(--line-soft); border-radius:4px; overflow:hidden; margin-bottom:16px;
}
.progress-fill{height:100%; background:linear-gradient(90deg, var(--teal-dim), var(--teal)); transition:width .3s;}

.card{
  background:var(--card); border:1px solid var(--line); border-radius:16px;
  padding:18px 16px; box-shadow:var(--shadow); margin-bottom:16px;
}
.set-tag{
  display:inline-block; font-size:.66rem; letter-spacing:.07em; text-transform:uppercase;
  color:var(--teal); background:rgba(63,217,199,0.1); border:1px solid var(--teal-dim);
  padding:3px 9px; border-radius:20px; margin-bottom:10px;
}
.problem-title{font-family:var(--serif); font-weight:600; font-size:1.05rem; margin:0 0 10px; color:var(--ink);}
.statement{font-size:.92rem; line-height:1.65; color:var(--ink); margin-bottom:16px;}
.statement .katex{font-size:1.02em;}

.parts{display:flex; flex-direction:column; gap:12px;}
.part{border-top:1px dashed var(--line-soft); padding-top:12px;}
.part:first-child{border-top:none; padding-top:0;}
.part-label{font-size:.85rem; color:var(--ink-dim); margin-bottom:8px; line-height:1.4;}
.part-label b{color:var(--ink); font-weight:600;}
.numeric-row{display:flex; align-items:center; gap:8px;}
input[type="text"], input[type="number"]{
  flex:1; background:var(--card2); border:1px solid var(--line); color:var(--ink);
  border-radius:9px; padding:10px 11px; font-family:var(--mono); font-size:.92rem;
  min-width:0;
}
input[type="text"]:focus, input[type="number"]:focus{outline:none; border-color:var(--teal);}
.unit-badge{
  font-size:.76rem; color:var(--ink-faint); background:var(--card2); border:1px solid var(--line);
  border-radius:8px; padding:9px 10px; white-space:nowrap; flex-shrink:0;
}
.mc-options{display:flex; flex-direction:column; gap:7px;}
.mc-opt{
  text-align:left; background:var(--card2); border:1px solid var(--line); color:var(--ink);
  border-radius:9px; padding:10px 12px; font-family:var(--mono); font-size:.84rem;
  cursor:pointer; transition:.12s;
}
.mc-opt:hover{border-color:var(--teal);}
.mc-opt.selected{border-color:var(--amber); background:rgba(240,169,58,0.1);}
.mc-opt.correct{border-color:var(--good); background:rgba(95,217,122,0.14); color:var(--good);}
.mc-opt.incorrect{border-color:var(--bad); background:rgba(240,102,90,0.14); color:var(--bad);}
.mc-opt:disabled{cursor:default;}

.feedback-icon{width:20px; height:20px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.85rem; border-radius:50%;}
.feedback-icon.good{background:rgba(95,217,122,0.18); color:var(--good);}
.feedback-icon.bad{background:rgba(240,102,90,0.18); color:var(--bad);}
.correct-answer{font-size:.74rem; color:var(--ink-faint); margin-top:4px;}
.correct-answer b{color:var(--good);}

.actions{display:flex; gap:10px; margin-top:18px; flex-wrap:wrap;}
.btn{
  flex:1; min-width:120px; padding:12px 14px; border-radius:11px; border:1px solid var(--line);
  font-family:var(--mono); font-weight:600; font-size:.85rem; cursor:pointer; transition:.15s;
  background:var(--card2); color:var(--ink);
}
.btn:active{transform:translateY(1px);}
.btn.primary{background:var(--amber); border-color:var(--amber); color:#1a1300;}
.btn.primary:hover{background:var(--amber-dim);}
.btn.secondary{border-color:var(--teal-dim); color:var(--teal);}
.btn.secondary:hover{border-color:var(--teal); background:rgba(63,217,199,0.08);}
.btn:disabled{opacity:.4; cursor:default;}

.result-banner{
  margin-top:14px; padding:10px 14px; border-radius:10px; font-size:.85rem; font-weight:600;
  display:flex; align-items:center; gap:8px;
}
.result-banner.good{background:rgba(95,217,122,0.12); color:var(--good); border:1px solid rgba(95,217,122,0.35);}
.result-banner.bad{background:rgba(240,102,90,0.12); color:var(--bad); border:1px solid rgba(240,102,90,0.35);}
.result-banner.info{background:rgba(63,217,199,0.1); color:var(--teal); border:1px solid rgba(63,217,199,0.3);}

.solution{
  margin-top:16px; padding-top:16px; border-top:1px solid var(--line-soft);
}
.solution h3{
  font-family:var(--serif); font-size:.92rem; margin:0 0 10px; color:var(--amber); font-weight:600;
}
.solution ol{margin:0; padding-left:20px;}
.solution li{font-size:.86rem; line-height:1.7; margin-bottom:6px; color:var(--ink);}
.solution .finalbox{
  margin-top:12px; padding:10px 12px; background:var(--card2); border:1px solid var(--line);
  border-radius:9px; font-size:.84rem; line-height:1.6;
}

.round-complete{text-align:center; padding:10px 0;}
.round-complete .big{font-family:var(--serif); font-weight:700; font-size:2.4rem; color:var(--amber); margin:6px 0;}
.round-complete .msg{color:var(--ink-dim); font-size:.85rem; margin-bottom:18px;}
.round-complete .newbest{color:var(--good); font-weight:600; font-size:.8rem; margin-top:-8px; margin-bottom:14px;}

/* Modal */
.modal-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter:blur(2px);
  display:none; align-items:flex-end; justify-content:center; z-index:50;
}
.modal-overlay.open{display:flex;}
.modal{
  background:var(--bg2); border:1px solid var(--line); border-radius:18px 18px 0 0;
  max-width:760px; width:100%; max-height:85vh; overflow-y:auto; padding:18px 16px 30px;
  box-shadow:0 -10px 40px rgba(0,0,0,0.5);
}
@media(min-width:820px){
  .modal-overlay{align-items:center;}
  .modal{border-radius:18px; max-height:80vh;}
}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.modal-head h2{font-family:var(--serif); font-size:1.15rem; margin:0; color:var(--amber);}
.closebtn{background:none; border:1px solid var(--line); color:var(--ink-dim); border-radius:8px; width:32px; height:32px; font-size:1rem; cursor:pointer;}
.formula-group{margin-bottom:18px;}
.formula-group h4{font-family:var(--serif); font-size:.88rem; color:var(--teal); margin:0 0 8px; font-weight:600;}
.formula-group ul{list-style:none; margin:0; padding:0;}
.formula-group li{
  background:var(--card); border:1px solid var(--line-soft); border-radius:9px;
  padding:9px 12px; margin-bottom:6px; font-size:.85rem; line-height:1.6;
}
.formula-group li .fname{color:var(--ink-dim); font-size:.72rem; display:block; margin-bottom:3px;}

footer{text-align:center; color:var(--ink-faint); font-size:.68rem; margin-top:24px; line-height:1.6;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>Circular Motion <span>Practice</span></h1>
      <div class="subtitle">Uniform Circular Motion &amp; Gravitation</div>
    </div>
    <div class="iconbtns">
      <button class="iconbtn" id="formulaBtn" title="Reference formulas">∑ Formulas</button>
      <button class="iconbtn" id="themeBtn" title="Toggle theme">◐</button>
    </div>
  </header>

  <div class="stats">
    <div class="stat"><div class="num" id="statStreak">0</div><div class="lbl">Streak</div></div>
    <div class="stat teal"><div class="num" id="statBest">0</div><div class="lbl">Best Streak</div></div>
    <div class="stat"><div class="num" id="statScore">0/0</div><div class="lbl">Round Score</div></div>
  </div>
  <div class="stats">
    <div class="stat teal"><div class="num" id="statLast">—</div><div class="lbl">Last Score</div></div>
    <div class="stat"><div class="num" id="statHigh">—</div><div class="lbl">High Score</div></div>
    <div class="stat teal"><div class="num" id="statQ">1</div><div class="lbl" id="statQLbl">of 10</div></div>
  </div>

  <div class="controls">
    <div>
      <label for="setSelect">Problem Set</label>
      <select id="setSelect">
        <option value="mixed" selected>Mixed — All Sets</option>
        <option value="1">Set 1 — Angular Motion &amp; Rolling</option>
        <option value="2">Set 2 — Centripetal Accel. &amp; Rotation</option>
        <option value="3">Set 3 — Force, Friction &amp; Banking</option>
        <option value="4">Set 4 — Reference Frames</option>
        <option value="5">Set 5 — Gravitation &amp; g</option>
        <option value="6">Set 6 — Satellites &amp; Kepler</option>
      </select>
    </div>
    <div>
      <label for="lenSelect">Round Length</label>
      <select id="lenSelect">
        <option value="10" selected>10 problems</option>
        <option value="20">20 problems</option>
        <option value="30">30 problems</option>
      </select>
    </div>
  </div>

  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

  <div id="cardArea"></div>

  <footer>Values are randomized on each problem — tolerances allow ±3% for rounding.<br>Set: g = 9.80 m/s² &nbsp;|&nbsp; G = 6.674×10⁻¹¹ N·m²/kg²</footer>
</div>

<div class="modal-overlay" id="formulaModal">
  <div class="modal">
    <div class="modal-head"><h2>Reference Formulas</h2><button class="closebtn" id="closeFormula">✕</button></div>
    <div id="formulaContent"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script>
/* ============================= UTIL ============================= */
const g = 9.80, G = 6.674e-11;
function rand(min,max){ return min + Math.random()*(max-min); }
function pick(min,max,dec){ const f=Math.pow(10,dec); return Math.round(rand(min,max)*f)/f; }
function pickInt(min,max){ return Math.floor(rand(min,max+1)); }
function choice(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

// format a number as LaTeX, using scientific notation for |exp|>=3
function sig3(x){
  if (x===0) return "0";
  const neg = x<0; const ax = Math.abs(x);
  const exp = Math.floor(Math.log10(ax));
  let out;
  if (exp>=3 || exp<=-3){
    const mant = ax/Math.pow(10,exp);
    let mstr = mant.toFixed(2);
    // handle rounding edge e.g. 10.00 -> 1.00 x10^(exp+1)
    if (parseFloat(mstr)>=10){ mstr=(mant/10).toFixed(2); out = `${mstr} \\times 10^{${exp+1}}`; }
    else out = `${mstr} \\times 10^{${exp}}`;
  } else if (exp>=0){
    const decimals = Math.max(0, 2-exp);
    out = ax.toFixed(decimals);
  } else {
    out = ax.toFixed(3-exp>5?5:3-exp<2?2:3-exp);
    // simpler: 3 sig figs for exp -1 or -2
    out = ax.toPrecision(3);
  }
  return (neg?"-":"") + out;
}
function plainNum(x, decimals){ return x.toFixed(decimals); }

/* ============================ PROBLEM BANK ============================ */
// Each generator returns {statement, parts:[{id,label,unit,value,tol,type:'num'}|{type:'mc',options,correct}], solution:[latex lines]}
const BANK = [];

/* ---------- SET 1: Angular Motion & Rolling ---------- */
BANK.push({set:1,title:"Bicycle Wheel Revolutions", gen(){
  const D = pick(10,25,1), v = pick(4.0,9.0,1), r = pick(0.25,0.45,3);
  const Dm = D*1000, theta = Dm/r, N = theta/(2*Math.PI), omega = v/r, t = Dm/v, tmin=t/60;
  return {
    statement:`A bicycle travels $${D.toFixed(1)}\\text{ km}$ at a constant speed of $${v.toFixed(1)}\\text{ m/s}$ on wheels of radius $${r.toFixed(3)}\\text{ m}$, rolling without slipping. Find:`,
    parts:[
      {id:'a',label:'(a) Number of wheel revolutions',unit:'rev',value:N,tol:0.03,type:'num'},
      {id:'b',label:'(b) Total angular displacement θ',unit:'rad',value:theta,tol:0.03,type:'num'},
      {id:'c',label:'(c) Angular velocity ω of the wheel',unit:'rad/s',value:omega,tol:0.03,type:'num'},
      {id:'d',label:'(d) Time for the trip',unit:'s',value:t,tol:0.03,type:'num'},
    ],
    solution:[
      `Rolling without slipping: $s = r\\theta$ and $v=r\\omega$. Convert distance: $${D.toFixed(1)}\\text{ km} = ${Dm.toFixed(0)}\\text{ m}$.`,
      `Angular displacement: $\\theta = s/r = ${Dm.toFixed(0)}/${r.toFixed(3)} = ${sig3(theta)}\\text{ rad}$.`,
      `Revolutions: $N = \\theta/(2\\pi) = ${sig3(N)}\\text{ rev}$.`,
      `Angular velocity: $\\omega = v/r = ${v.toFixed(1)}/${r.toFixed(3)} = ${sig3(omega)}\\text{ rad/s}$.`,
      `Time: $t = s/v = ${Dm.toFixed(0)}/${v.toFixed(1)} = ${sig3(t)}\\text{ s}$ (${sig3(tmin)} min).`
    ]
  };
}});

BANK.push({set:1,title:"Lab Rotor Startup", gen(){
  const rpm = pick(2000,4500,0), t = pick(8,16,1), rcm = pick(5,12,1);
  const wf = rpm*2*Math.PI/60, alpha = wf/t, theta = (0+wf)*t/2, r=rcm/100, v=r*wf;
  return {
    statement:`A laboratory rotor accelerates uniformly from rest to $${rpm}\\text{ rev/min}$ in $${t.toFixed(1)}\\text{ s}$. A sample sits $${rcm.toFixed(1)}\\text{ cm}$ from the axis. Find:`,
    parts:[
      {id:'a',label:'(a) Final angular velocity',unit:'rad/s',value:wf,tol:0.03,type:'num'},
      {id:'b',label:'(b) Angular acceleration α',unit:'rad/s²',value:alpha,tol:0.03,type:'num'},
      {id:'c',label:'(c) Angular displacement during startup',unit:'rad',value:theta,tol:0.03,type:'num'},
      {id:'d',label:'(d) Final tangential speed of the sample',unit:'m/s',value:v,tol:0.03,type:'num'},
    ],
    solution:[
      `Convert: $\\omega_f = ${rpm}\\times \\frac{2\\pi}{60} = ${sig3(wf)}\\text{ rad/s}$.`,
      `$\\alpha = (\\omega_f-\\omega_i)/t = ${sig3(wf)}/${t.toFixed(1)} = ${sig3(alpha)}\\text{ rad/s}^2$.`,
      `For uniform angular acceleration from rest: $\\theta=(\\omega_i+\\omega_f)t/2 = ${sig3(theta)}\\text{ rad}$.`,
      `Convert radius: $r=${r.toFixed(4)}\\text{ m}$. $v=r\\omega_f = ${sig3(v)}\\text{ m/s}$.`
    ]
  };
}});

BANK.push({set:1,title:"Car Braking Without Skidding", gen(){
  const r = pick(0.25,0.35,3), vi = pick(20,30,1), vf = pick(5,12,1), t = pick(4,8,1);
  const wi=vi/r, wf=vf/r, alpha=(wf-wi)/t, theta=(wi+wf)*t/2, N=theta/(2*Math.PI), s=r*theta;
  return {
    statement:`A car with tires of radius $${r.toFixed(3)}\\text{ m}$ travels at $${vi.toFixed(1)}\\text{ m/s}$. The driver brakes and the car slows uniformly to $${vf.toFixed(1)}\\text{ m/s}$ over $${t.toFixed(1)}\\text{ s}$ without skidding. Find:`,
    parts:[
      {id:'a',label:'(a) Initial tire angular velocity ω_i',unit:'rad/s',value:wi,tol:0.03,type:'num'},
      {id:'a2',label:'Final tire angular velocity ω_f',unit:'rad/s',value:wf,tol:0.03,type:'num'},
      {id:'b',label:'(b) Angular acceleration α (include sign)',unit:'rad/s²',value:alpha,tol:0.05,type:'num'},
      {id:'c',label:'(c) Number of tire revolutions during braking',unit:'rev',value:N,tol:0.03,type:'num'},
      {id:'d',label:'(d) Distance traveled',unit:'m',value:s,tol:0.03,type:'num'},
    ],
    solution:[
      `$\\omega_i=v_i/r=${vi.toFixed(1)}/${r.toFixed(3)}=${sig3(wi)}\\text{ rad/s}$; $\\omega_f=v_f/r=${sig3(wf)}\\text{ rad/s}$.`,
      `$\\alpha=(\\omega_f-\\omega_i)/t=${sig3(alpha)}\\text{ rad/s}^2$.`,
      `$\\theta=(\\omega_i+\\omega_f)t/2=${sig3(theta)}\\text{ rad}$, so $N=\\theta/(2\\pi)=${sig3(N)}\\text{ rev}$.`,
      `$s=r\\theta=${sig3(s)}\\text{ m}$.`
    ]
  };
}});

BANK.push({set:1,title:"CD at Two Radii", gen(){
  const rpm = pick(300,600,0), r1cm=pick(1.5,3.0,2), r2cm=pick(4.0,7.0,2), tt=pick(2,6,1);
  const omega=rpm*2*Math.PI/60, r1=r1cm/100, r2=r2cm/100, v1=r1*omega, v2=r2*omega;
  const theta=omega*tt, s1=r1*theta, s2=r2*theta, ratio=v2/v1;
  return {
    statement:`A compact disk rotates at $${rpm}\\text{ rev/min}$. Compare points at radii $${r1cm.toFixed(2)}\\text{ cm}$ and $${r2cm.toFixed(2)}\\text{ cm}$. Find:`,
    parts:[
      {id:'a',label:'(a) The common angular velocity',unit:'rad/s',value:omega,tol:0.03,type:'num'},
      {id:'b1',label:'(b) Tangential speed at r₁',unit:'m/s',value:v1,tol:0.03,type:'num'},
      {id:'b2',label:'Tangential speed at r₂',unit:'m/s',value:v2,tol:0.03,type:'num'},
      {id:'c',label:`(c) Arc length each point travels in ${tt.toFixed(1)} s — at r₁`,unit:'m',value:s1,tol:0.03,type:'num'},
      {id:'c2',label:'Arc length at r₂',unit:'m',value:s2,tol:0.03,type:'num'},
      {id:'d',label:'(d) Ratio of tangential speeds v₂/v₁',unit:'',value:ratio,tol:0.03,type:'num'},
    ],
    solution:[

/* ============================ APP STATE ============================ */
const LS_KEY = 'ch6_circular_motion_practice_v1';
let state = {
  theme:'dark', currentStreak:0, bestStreak:0,
  lastScorePct:null, lastScoreDetail:null,
  highScorePct:null, highScoreDetail:null,
  roundLength:10, roundAnswered:0, roundCorrect:0,
};
function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ Object.assign(state, JSON.parse(raw)); }
  }catch(e){}
}
function saveState(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
}

let currentProblem = null; // {def, gen result, answered:bool}

function pickGenerator(){
  const setSel = document.getElementById('setSelect').value;
  let pool = BANK;
  if (setSel !== 'mixed'){
    const s = parseInt(setSel,10);
    pool = BANK.filter(b=>b.set===s);
  }
  return choice(pool);
}

function newProblem(){
  const def = pickGenerator();
  const built = def.gen();
  currentProblem = {def, built, answered:false, userMC:{}};
  renderProblem();
}

function renderProblem(){
  const {def, built} = currentProblem;
  const area = document.getElementById('cardArea');
  let partsHtml = '';
  built.parts.forEach(p=>{
    if (p.type==='mc'){
      let optsHtml = p.options.map((opt,i)=>`<button class="mc-opt" data-part="${p.id}" data-idx="${i}">${opt}</button>`).join('');
      partsHtml += `<div class="part" data-partid="${p.id}" data-type="mc">
        <div class="part-label">${p.label}</div>
        <div class="mc-options">${optsHtml}</div>
        <div class="fb-slot"></div>
      </div>`;
    } else {
      partsHtml += `<div class="part" data-partid="${p.id}" data-type="num">
        <div class="part-label">${p.label}</div>
        <div class="numeric-row">
          <input type="text" inputmode="decimal" autocomplete="off" placeholder="Enter value…" data-part="${p.id}">
          <span class="unit-badge">${p.unit||'—'}</span>
        </div>
        <div class="fb-slot"></div>
      </div>`;
    }
  });

  area.innerHTML = `
    <div class="card" id="problemCard">
      <span class="set-tag">Set ${def.set}</span>
      <h2 class="problem-title">${def.title}</h2>
      <div class="statement">${built.statement}</div>
      <div class="parts">${partsHtml}</div>
      <div id="resultArea"></div>
      <div class="actions" id="actionRow">
        <button class="btn primary" id="checkBtn">Check Answer</button>
        <button class="btn secondary" id="solutionBtn">Show Solution</button>
      </div>
    </div>
  `;
  renderMath();
  document.getElementById('checkBtn').addEventListener('click', onCheck);
  document.getElementById('solutionBtn').addEventListener('click', ()=>onReveal(false));
  area.querySelectorAll('.mc-opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const partId = btn.dataset.part;
      const idx = parseInt(btn.dataset.idx,10);
      currentProblem.userMC[partId]=idx;
      const group = btn.closest('.mc-options');
      group.querySelectorAll('.mc-opt').forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
    });
  });
}

function parseNum(str){
  if (str===undefined || str===null) return NaN;
  const cleaned = str.replace(/,/g,'').trim();
  return parseFloat(cleaned);
}

function onCheck(){
  if (currentProblem.answered) return;
  const {built} = currentProblem;
  let allCorrect = true;
  built.parts.forEach(p=>{
    const partEl = document.querySelector(`.part[data-partid="${CSS.escape(p.id)}"]`);
    let isCorrect;
    if (p.type==='mc'){
      const userIdx = currentProblem.userMC[p.id];
      isCorrect = (userIdx === p.correct);
      partEl.querySelectorAll('.mc-opt').forEach((btn,i)=>{
        btn.disabled = true;
        if (i===p.correct) btn.classList.add('correct');
        else if (i===userIdx) btn.classList.add('incorrect');
      });
    } else {
      const input = partEl.querySelector('input');
      const userVal = parseNum(input.value);
      if (isNaN(userVal)){ isCorrect=false; }
      else {
        const rel = Math.abs(userVal-p.value)/Math.max(Math.abs(p.value),1e-30);
        isCorrect = rel <= p.tol;
      }
      input.disabled = true;
      input.style.borderColor = isCorrect ? 'var(--good)' : 'var(--bad)';
      const fb = partEl.querySelector('.fb-slot');
      fb.innerHTML = isCorrect ? '' : `<div class="correct-answer">Correct: <b>$${sig3(p.value)}$ ${p.unit||''}</b></div>`;
    }
    if (!isCorrect) allCorrect = false;
  });
  finishProblem(allCorrect, false);
}

function onReveal(){
  if (currentProblem.answered) return;
  finishProblem(false, true);
}

function finishProblem(allCorrect, wasSkipped){
  currentProblem.answered = true;
  document.getElementById('actionRow').innerHTML = '';
  const resultArea = document.getElementById('resultArea');

  // update stats
  state.roundAnswered++;
  if (allCorrect && !wasSkipped){
    state.roundCorrect++;
    state.currentStreak++;
    if (state.currentStreak > state.bestStreak) state.bestStreak = state.currentStreak;
    resultArea.innerHTML = `<div class="result-banner good">✓ Correct — nice work.</div>`;
  } else {
    state.currentStreak = 0;
    resultArea.innerHTML = `<div class="result-banner ${wasSkipped?'info':'bad'}">${wasSkipped? '⤴ Solution revealed — this one is marked as not solved.' : '✗ Not quite — check the solution below.'}</div>`;
  }

  // solution panel
  const {built} = currentProblem;
  const solHtml = `
    <div class="solution">
      <h3>Worked Solution</h3>
      <ol>${built.parts ? built.solution.map(s=>`<li>${s}</li>`).join('') : ''}</ol>
    </div>`;
  document.getElementById('problemCard').insertAdjacentHTML('beforeend', solHtml);
  renderMath();

  const card = document.getElementById('problemCard');
  card.insertAdjacentHTML('beforeend', `<div class="actions"><button class="btn primary" id="nextBtn">Next Problem →</button></div>`);
  document.getElementById('nextBtn').addEventListener('click', onNext);

  saveState();
  updateStatsDisplay();

  if (state.roundAnswered >= state.roundLength){
    setTimeout(()=>{ showRoundComplete(); }, 50);
  }
}

function onNext(){
  if (state.roundAnswered >= state.roundLength){
    showRoundComplete();
    return;
  }
  newProblem();
  updateStatsDisplay();
}

function showRoundComplete(){
  const pct = Math.round((state.roundCorrect/state.roundLength)*1000)/10;
  const detail = `${state.roundCorrect}/${state.roundLength}`;
  state.lastScorePct = pct;
  state.lastScoreDetail = detail;
  let newBest = false;
  if (state.highScorePct===null || pct > state.highScorePct || (pct===state.highScorePct)){
    if (state.highScorePct===null || pct > state.highScorePct){
      newBest = true;
      state.highScorePct = pct;
      state.highScoreDetail = detail;
    }
  }
  saveState();
  updateStatsDisplay();

  const area = document.getElementById('cardArea');
  area.innerHTML = `
    <div class="card">
      <div class="round-complete">
        <div class="set-tag" style="margin:0 auto 10px;">Round Complete</div>
        <div class="big">${detail}</div>
        <div class="msg">${pct.toFixed(1)}% correct this round</div>
        ${newBest? '<div class="newbest">🏆 New High Score!</div>':''}
        <button class="btn primary" id="restartBtn" style="max-width:280px; margin:0 auto; display:block;">Start New Round</button>
      </div>
    </div>
  `;
  document.getElementById('restartBtn').addEventListener('click', startRound);
  document.getElementById('progressFill').style.width='100%';
}

function startRound(){
  state.roundLength = parseInt(document.getElementById('lenSelect').value,10);
  state.roundAnswered = 0;
  state.roundCorrect = 0;
  saveState();
  newProblem();
  updateStatsDisplay();
}

function updateStatsDisplay(){
  document.getElementById('statStreak').textContent = state.currentStreak;
  document.getElementById('statBest').textContent = state.bestStreak;
  document.getElementById('statScore').textContent = `${state.roundCorrect}/${state.roundAnswered}`;
  document.getElementById('statLast').textContent = state.lastScoreDetail ? `${state.lastScoreDetail}` : '—';
  document.getElementById('statHigh').textContent = state.highScoreDetail ? `${state.highScoreDetail}` : '—';
  const qnum = Math.min(state.roundAnswered+1, state.roundLength);
  document.getElementById('statQ').textContent = qnum;
  document.getElementById('statQLbl').textContent = `of ${state.roundLength}`;
  const pct = Math.min(100, (state.roundAnswered/state.roundLength)*100);
  document.getElementById('progressFill').style.width = pct+'%';
}

function renderMath(){
  if (window.renderMathInElement){
    renderMathInElement(document.body, {
      delimiters:[
        {left:'$$', right:'$$', display:true},
        {left:'$', right:'$', display:false}
      ],
      throwOnError:false
    });
  }
}

function buildFormulaModal(){
  let html='';
  for (let s=1; s<=6; s++){
    const grp = FORMULAS[s];
    html += `<div class="formula-group"><h4>${grp.title}</h4><ul>`;
    grp.items.forEach(([name, tex])=>{
      html += `<li><span class="fname">${name}</span>${tex}</li>`;
    });
    html += `</ul></div>`;
  }
  document.getElementById('formulaContent').innerHTML = html;
  renderMath();
}
document.getElementById('formulaBtn').addEventListener('click', ()=>{
  document.getElementById('formulaModal').classList.add('open');
});
document.getElementById('closeFormula').addEventListener('click', ()=>{
  document.getElementById('formulaModal').classList.remove('open');
});
document.getElementById('formulaModal').addEventListener('click', (e)=>{
  if (e.target.id==='formulaModal') document.getElementById('formulaModal').classList.remove('open');
});

/* ============================ CONTROLS ============================ */
document.getElementById('setSelect').addEventListener('change', ()=>{
  // if the current problem hasn't been answered yet, swap it immediately to match the new set filter
  if (currentProblem && !currentProblem.answered){
    newProblem();
  }
});
document.getElementById('lenSelect').addEventListener('change', ()=>{
  // takes effect on next round start; no immediate action needed
});

/* ============================ INIT ============================ */
loadState();
applyTheme();
document.getElementById('lenSelect').value = String(state.roundLength||10);
buildFormulaModal();
updateStatsDisplay();
if (state.roundAnswered>0 && state.roundAnswered < state.roundLength){
  newProblem(); // resume mid-round with a fresh random problem
} else {
  startRound();
}
</script>
</body>
</html>
